<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Multi-Agent Chatbot architecture</title>
  <desc id="archDesc">Frontend talks to an Nginx gateway, which proxies to the FastAPI backend. The backend runs a LangGraph pipeline (Preprocess, Router, Specialist, Judge, Finalize) with a retry loop from Judge back to Specialist, calls an Ollama/LLM server, and reads/writes Qdrant, Postgres and Redis.</desc>

  <!-- top row: Frontend -> Gateway -> Backend -> LLM server -->
  <path d="M320 195H420" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M680 195H780" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1160 195H1260" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="420" cy="195" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="780" cy="195" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="1260" cy="195" r="5" fill="rgba(255,255,255,0.5)"/>

  <!-- Frontend -->
  <rect x="60" y="110" width="260" height="170" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="88" y="158" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">Frontend</text>
  <text x="88" y="182" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">React + Vite SPA</text>
  <text x="88" y="204" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Chat UI, live routing panel,</text>
  <text x="88" y="224" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">SSE stream consumer</text>

  <!-- Gateway -->
  <rect x="420" y="110" width="260" height="170" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="448" y="158" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">Gateway</text>
  <text x="448" y="182" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Nginx reverse proxy</text>
  <text x="448" y="204" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Rate limiting, SSE-aware</text>
  <text x="448" y="224" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">proxying, single entry point</text>

  <!-- Backend (emphasized) -->
  <rect x="780" y="70" width="380" height="260" rx="10" fill="#f2f2f3"/>
  <text x="808" y="112" fill="#0a0a0a" font-family="Space Grotesk, Arial, sans-serif" font-size="19" font-weight="700">Backend</text>
  <text x="808" y="133" fill="#4b4b4f" font-family="Manrope, Arial, sans-serif" font-size="13">FastAPI + LangGraph</text>

  <text x="808" y="163" fill="#2563a8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="832" y="163" fill="#0a0a0a" font-family="Manrope, Arial, sans-serif" font-size="13">Preprocess</text>

  <text x="808" y="189" fill="#2563a8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="832" y="189" fill="#0a0a0a" font-family="Manrope, Arial, sans-serif" font-size="13">Router</text>

  <text x="808" y="215" fill="#2563a8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="832" y="215" fill="#0a0a0a" font-family="Manrope, Arial, sans-serif" font-size="13">Specialist</text>

  <text x="808" y="241" fill="#2563a8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="832" y="241" fill="#0a0a0a" font-family="Manrope, Arial, sans-serif" font-size="13">Judge</text>

  <text x="808" y="267" fill="#2563a8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">05</text>
  <text x="832" y="267" fill="#0a0a0a" font-family="Manrope, Arial, sans-serif" font-size="13">Finalize</text>

  <!-- retry loop: Judge back to Specialist -->
  <path d="M945 236 C1005 236 1005 210 945 210" stroke="#c0392b" stroke-width="2" fill="none"/>
  <polygon points="945,210 954,205 954,215" fill="#c0392b"/>
  <text x="1012" y="226" fill="#c0392b" font-family="JetBrains Mono, Consolas, monospace" font-size="11">retry</text>

  <!-- LLM server -->
  <rect x="1260" y="110" width="260" height="170" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="1288" y="158" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">LLM server</text>
  <text x="1288" y="182" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Ollama (dev) / vLLM (prod)</text>
  <text x="1288" y="204" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Base model or per-domain</text>
  <text x="1288" y="224" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">LoRA adapter</text>

  <!-- Backend -> infra services -->
  <path d="M970 330V390" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M640 390H1300" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 390V430" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M970 390V430" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1300 390V430" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="970" cy="390" r="5" fill="rgba(255,255,255,0.5)"/>

  <!-- Qdrant -->
  <rect x="520" y="430" width="240" height="150" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="548" y="478" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">Qdrant</text>
  <text x="548" y="502" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Vector store for RAG</text>
  <text x="548" y="522" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Hybrid dense + BM25</text>
  <text x="548" y="542" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">retrieval, one collection/domain</text>

  <!-- Postgres -->
  <rect x="850" y="430" width="240" height="150" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="878" y="478" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">Postgres</text>
  <text x="878" y="502" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">LangGraph checkpointer</text>
  <text x="878" y="522" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Conversation state, keeps</text>
  <text x="878" y="542" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">the API layer stateless</text>

  <!-- Redis -->
  <rect x="1180" y="430" width="240" height="150" rx="10" fill="#111214" stroke="rgba(255,255,255,0.14)"/>
  <text x="1208" y="478" fill="#f2f2f3" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700">Redis</text>
  <text x="1208" y="502" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">Provisioned, not wired in</text>
  <text x="1208" y="522" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">yet &#8212; intended for</text>
  <text x="1208" y="542" fill="#8f8f96" font-family="Manrope, Arial, sans-serif" font-size="13">semantic caching</text>
</svg>
